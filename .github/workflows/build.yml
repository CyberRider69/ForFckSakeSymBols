name: Build Kernel with symbols

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/tedomi2705/kernel_xiaomi_sdm845.git
  KERNEL_BRANCH: vic
  CLANG_VERSION: "r536225"   # AOSP clang 19.0.1 — matches this device's actual boot string
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo (for stored config)
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Clone kernel source
        run: |
          git clone --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          cd kernel
          MATCH=""
          for CANDIDATE in "b0fb2a6d"; do
            if git rev-parse --verify --quiet "${CANDIDATE}^{commit}" > /dev/null; then
              MATCH="${CANDIDATE}"
              break
            fi
          done
          if [ -n "${MATCH}" ]; then
            git checkout "${MATCH}"
            echo "Pinned to commit: $(git rev-parse HEAD)"
          else
            echo "Candidate commit not found, staying on branch ${KERNEL_BRANCH}"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Clean source tree
        run: |
          cd kernel
          # mrproper wipes those so the out-of-tree build can start clean.
          make mrproper || true

      - name: Patch clang-19 inline-asm constraint incompatibilities
        run: |
          cd kernel
          set -e

          # REVERTED: this step previously force-converted "I"/"L" immediate
          # constraints in spinlock.h (TICKET_SHIFT) and pgtable.h (PTE_AF,
          # PTE_RDONLY) to "r" register constraints, on the assumption clang
          # rejected them as immediates. That assumption was wrong — these
          # values ARE valid AArch64 immediates and clang accepts them fine.
          # Forcing them into registers instead broke the actual instruction
          # encoding:
          #   - ubfx's #lsb/#width fields must be compile-time immediates —
          #     a register there ("ubfx w8, w11, x10, #1") is not a legal
          #     encoding, hence "unrecognized instruction mnemonic".
          #   - the spinlock add lost its %w-width modifier once %3 became a
          #     register operand, producing an illegal 32/64-bit register
          #     mix ("add w10, w10, x9").
          # Confirmed by an actual build: reverting to the original "I"/"L"
          # immediates removes both errors. If a genuine constraint issue
          # ever resurfaces here, the correct fix is to add %w/%x width
          # modifiers to the asm template — not to change immediate
          # constraints to register constraints.

          echo "spinlock.h / pgtable.h: left at original immediate constraints (no patch needed)"
          # specifically (unlike other GPRs) since it needs full control
          # of the stack pointer for its own codegen — this is a hard
          # clang restriction, not a bug. Old kernel code declared
          # current_stack_pointer as a global register variable bound to
          # sp; replace it with a static inline that reads sp via a plain
          # "mov" inline-asm instruction instead, exposed under the same
          # identifier via a macro so every call site is unaffected.
          f=arch/arm64/include/asm/stack_pointer.h
          grep -q 'register unsigned long current_stack_pointer asm ("sp");' "$f" || { echo "PATCH TARGET NOT FOUND in $f — aborting"; exit 1; }
          # NOTE: a `cat > "$f" << 'EOF'` heredoc here previously broke, because
          # its body sat at column 0 while it's nested inside this `run: |`
          # YAML block scalar. YAML block scalars require every line to stay
          # at or above the indentation of the block's first line — a
          # de-dented line ends the block early, so the C source was parsed
          # as YAML structure instead of shell script content, and the file
          # was never actually rewritten. printf keeps everything on
          # normally-indented lines, so it can't trip that rule. TAB is built
          # via printf rather than bash's $'\t' so this also works verbatim
          # under /bin/sh, not just bash.
          TAB="$(printf '\t')"
          printf '%s\n' \
            '#ifndef __ASM_STACK_POINTER_H' \
            '#define __ASM_STACK_POINTER_H' \
            '' \
            '/*' \
            ' * how to get the current stack pointer from C' \
            ' */' \
            'static __always_inline unsigned long __current_stack_pointer(void)' \
            '{' \
            "${TAB}unsigned long sp;" \
            "${TAB}asm (\"mov %0, sp\" : \"=r\" (sp));" \
            "${TAB}return sp;" \
            '}' \
            '#define current_stack_pointer __current_stack_pointer()' \
            '' \
            '#endif /* __ASM_STACK_POINTER_H */' \
            > "$f"
          echo "--- Verifying stack_pointer.h ---"
          cat "$f"
          grep -q 'register unsigned long current_stack_pointer asm ("sp");' "$f" && \
            { echo "FATAL: old 'register sp' line still present after patch — write did not take effect"; exit 1; }
          grep -q '__current_stack_pointer' "$f" || \
            { echo "FATAL: new inline-asm content missing after patch"; exit 1; }
          echo "stack_pointer.h patch confirmed on disk: $(sha256sum "$f")"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 python3-pip rsync git curl wget xz-utils

      - name: Download and Install AOSP Clang ${{ env.CLANG_VERSION }} Prebuilt
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          # Pulls just this one clang directory out of the (huge) AOSP prebuilts
          # repo via googlesource's archive-tarball endpoint, instead of cloning
          # the whole history. clang-r536225 = clang 19.0.1, the exact build
          # this device's stock/nightly kernel reports in its boot string.
          wget "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz"
          tar -xf "clang-${CLANG_VERSION}.tar.gz" -C $GITHUB_WORKSPACE/toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify clang version
        run: |
          clang --version || true

      - name: Download 32-bit GCC for compat vDSO (CROSS_COMPILE_ARM32)
        run: |
          # arch/arm64/Makefile refuses to build without this: the 64-bit
          # clang/LLVM toolchain alone can't produce the 32-bit vDSO blob
          # needed for compat (32-bit app) support. AOSP dropped the GCC
          # binaries from its own googlesource mirror years ago, so pull
          # LineageOS's mirror instead — same prebuilt, still intact.
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            $GITHUB_WORKSPACE/toolchain-arm32
          echo "ARM32_GCC_PATH=$GITHUB_WORKSPACE/toolchain-arm32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"
          
      - name: Apply stored device config
        run: |
          mkdir -p kernel/out
          cp workflow-repo/.github/workflows/configs/kernel.config kernel/out/.config

      - name: Enable required config symbols (binfmt_misc + namespace/container/overlay)
        run: |
          cd kernel
          # All =y, built directly into the kernel image
          for opt in \
            CONFIG_BINFMT_MISC \
            CONFIG_USER_NS \
            CONFIG_NET_NSH \
            CONFIG_KPROBES \
            CONFIG_UPROBES \
            CONFIG_CHECKPOINT_RESTORE \
            CONFIG_OVERLAY_FS_REDIRECT_DIR \
            CONFIG_QUEUED_SPINLOCKS \
            CONFIG_SYSVIPC \
            CONFIG_PID_NS \
            CONFIG_UTS_NS \
            CONFIG_FHANDLE \
            CONFIG_SQUASHFS \
            CONFIG_XZ_DEC \
            CONFIG_SECURITYFS \
            CONFIG_MEMFD_CREATE \
            CONFIG_EXT4_FS_POSIX_ACL \
            CONFIG_DEVTMPFS \
            CONFIG_VETH \
            CONFIG_CGROUP_DEVICE \
            CONFIG_CGROUP_PIDS \
            CONFIG_VT \
            CONFIG_DEVTMPFS_MOUNT \
            CONFIG_DEVPTS_FS \
            CONFIG_BLK_CGROUP \
            CONFIG_SYSVIPC_SYSCTL \
            CONFIG_NF_TABLES \
            CONFIG_NAMESPACES
          do
            ./scripts/config --file out/.config --enable "${opt#CONFIG_}"
          done
          
      - name: Check which symbols actually exist in this tree's Kconfig
        run: |
          cd kernel
          for opt in UPROBES XZ_DEC CGROUP_PIDS \
            CHECKPOINT_RESTORE EXT4_FS_POSIX_ACL UTS_NS \
            NF_TABLES SECURITYFS VT VETH PID_NS NET_NSH \
            BLK_CGROUP CGROUP_DEVICE MEMFD_CREATE FANOTIFY FHANDLE SYSVIPC \
            SYSVIPC_SYSCTL DEVTMPFS DEVTMPFS_MOUNT DEVPTS_FS \
            BINFMT_MISC USER_NS SQUASHFS NAMESPACES KPROBES OVERLAY_FS_REDIRECT_DIR ; do
            if grep -rq "^config ${opt}\$" --include='Kconfig*' .; then
              echo "REAL   CONFIG_${opt}"
            else
              echo "GHOST  CONFIG_${opt}  <- no Kconfig entry in this tree, enabling it does nothing"
            fi
          done

      - name: Debug dependency chains for NetHunter-critical symbols
        run: |
          cd kernel
          # UPROBES isn't on NetHunter's critical path (chroot/container/KeX
          # don't use it) — checked for completeness, but the ones below are
          # what actually break NetHunter if olddefconfig silently drops them.
          for opt in UPROBES USER_NS NAMESPACES PID_NS UTS_NS \
            OVERLAY_FS OVERLAY_FS_REDIRECT_DIR BINFMT_MISC CGROUP_DEVICE CGROUP_PIDS BLK_CGROUP; do
            echo "=== ${opt} ==="
            entry=$(grep -rn "^config ${opt}\$" --include='Kconfig*' -A6 . 2>/dev/null || true)
            if [ -z "$entry" ]; then
              echo "  NO KCONFIG ENTRY — enabling this does nothing in this tree"
            else
              echo "$entry" | sed 's/^/  /'
            fi
          done

      - name: Debug why asm-offsets.s fails on this clang (spinlock/pgtable constraints)
        run: |
          cd kernel
          # This device's own running kernel was built with this exact clang
          # (r536225/19.0.1) and boots fine, so the source itself compiles
          # under this clang somewhere else — meaning the .config here is
          # likely routing into the legacy ticket-spinlock code path
          # (arch/arm64/include/asm/spinlock.h), which uses inline asm with
          # oversized "I"/"L" constraint immediates that this clang now
          # rejects. Modern queued spinlocks avoid that code entirely.
          # This is a pure .config question, no source patch involved.
          echo "--- QUEUED_SPINLOCKS Kconfig entry ---"
          grep -rn "^config QUEUED_SPINLOCKS\$" --include='Kconfig*' -A6 . 2>/dev/null || echo "NO KCONFIG ENTRY for QUEUED_SPINLOCKS in this tree"
          echo ""
          echo "--- Anything that selects/requires it (arch support) ---"
          grep -rn "ARCH_USE_QUEUED_SPINLOCKS" --include='Kconfig*' . 2>/dev/null || echo "not found"
          echo ""
          echo "--- Current state in stored config (before olddefconfig) ---"
          grep -E "CONFIG_QUEUED_SPINLOCKS|CONFIG_ARCH_USE_QUEUED_SPINLOCKS|CONFIG_ARM64_LSE_ATOMICS" out/.config || echo "none of these set"

      - name: Reconcile config (olddefconfig)
        run: |
          cd kernel
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32="${ARM32_GCC_PATH}" olddefconfig

      - name: Verify final config
        run: |
          cd kernel
          echo "Checking out/.config BEFORE build (this is what actually gets compiled):"
          grep -E "CONFIG_BINFMT_MISC|CONFIG_USER_NS|CONFIG_NET_NSH|CONFIG_KPROBES|CONFIG_UPROBES|CONFIG_CHECKPOINT_RESTORE|CONFIG_OVERLAY_FS_REDIRECT_DIR|CONFIG_SYSVIPC|CONFIG_PID_NS|CONFIG_UTS_NS|CONFIG_FHANDLE|CONFIG_SQUASHFS|CONFIG_XZ_DEC|CONFIG_SECURITYFS|CONFIG_MEMFD_CREATE|CONFIG_EXT4_FS_POSIX_ACL|CONFIG_DEVTMPFS|CONFIG_VETH|CONFIG_CGROUP_DEVICE|CONFIG_CGROUP_PIDS|CONFIG_VT|CONFIG_DEVTMPFS_MOUNT|CONFIG_DEVPTS_FS|CONFIG_BLK_CGROUP|CONFIG_SYSVIPC_SYSCTL|CONFIG_NF_TABLES|CONFIG_NAMESPACES" out/.config

          echo ""
          echo "--- NetHunter-critical subset (chroot/container/KeX depend on these) ---"
          for opt in USER_NS NAMESPACES PID_NS UTS_NS OVERLAY_FS OVERLAY_FS_REDIRECT_DIR BINFMT_MISC CGROUP_DEVICE CGROUP_PIDS BLK_CGROUP QUEUED_SPINLOCKS; do
            line=$(grep "^CONFIG_${opt}=" out/.config || true)
            if [ -n "$line" ]; then
              echo "OK    $line"
            else
              echo "MISSING  CONFIG_${opt}  <- dropped by olddefconfig, NetHunter functionality may break"
            fi
          done

      - name: Sanity-check patches survived up to build time
        run: |
          cd kernel
          # Runs immediately before the real build. If this ever fails while
          # the patch step above succeeded, something *between* the two
          # steps (olddefconfig, O=out staleness, a config step touching the
          # tree, etc.) is reverting the change — this pinpoints exactly
          # when, instead of letting clang fail deep inside asm-offsets.s
          # with a confusing "register sp" error that looks like the patch
          # never ran at all.
          set -e
          f=arch/arm64/include/asm/stack_pointer.h
          echo "--- stack_pointer.h immediately before build ---"
          cat "$f"
          if grep -q 'register unsigned long current_stack_pointer asm ("sp");' "$f"; then
            echo "FATAL: stack_pointer.h reverted to unpatched content before build started."
            echo "The 'Patch clang-19...' step succeeded earlier, so something after it"
            echo "restored the original file. Check whether O=out is stale from a"
            echo "previous run, or whether any step between here and the patch does"
            echo "a git checkout/reset/clean on the kernel tree."
            exit 1
          fi
          echo "OK: stack_pointer.h still patched. sha256: $(sha256sum "$f")"

      - name: Debug why vdso build uses wrong register names (x0/x8/x29 'unknown')
        run: |
          cd kernel
          # arch/arm64/kernel/vdso/vgettimeofday.o and sigreturn.o fail with
          # "unknown register name 'x0'" and "invalid instruction mnemonic
          # 'svc'" — those are valid AArch64 names/instructions, so the
          # assembler must be targeting something other than arm64 for this
          # one subdirectory, even though the rest of the tree (which built
          # clean) is clearly targeting arm64 correctly. The vdso Makefile in
          # this fork is old/legacy code that predates LLVM=1 auto-detecting
          # the clang target — it typically derives --target= from the
          # traditional CROSS_COMPILE prefix instead, and this workflow only
          # ever sets CROSS_COMPILE_ARM32 (for the 32-bit compat vdso), never
          # plain CROSS_COMPILE for the 64-bit build. Printing the relevant
          # Makefile(s) here so the theory is visible in the log, not assumed.
          echo "--- arch/arm64/kernel/vdso/Makefile ---"
          cat arch/arm64/kernel/vdso/Makefile 2>/dev/null || echo "not found at that path"
          echo ""
          echo "--- grep for target/triple/CROSS_COMPILE handling in it ---"
          grep -nE 'target|CROSS_COMPILE|CC_FLAGS|VDSO_CFLAGS' arch/arm64/kernel/vdso/Makefile 2>/dev/null || true

      - name: Build full kernel
        continue-on-error: true
        run: |
          cd kernel
          make -j"$(nproc)" ARCH="$ARCH" O=out LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32="${ARM32_GCC_PATH}"


      - name: Fetch AK3 template
        run: |
          pip install --break-system-packages gdown
          gdown "https://drive.google.com/uc?id=1MAb7snGkXk5prCRXJ0a9H2Z9n6MD5n80" -O "Hayasaka-beryllium-4.9.337-ksu-next-susfs-20250622.zip"

          mkdir -p AK3_extracted AK3
          unzip -o "Hayasaka-beryllium-4.9.337-ksu-next-susfs-20250622.zip" -d AK3_extracted
          # Copy everything from the template except the old kernel image —
          # anykernel.sh, ramdisk patches, KernelSU-Next installer scripts,
          # etc. all carry over unchanged; only Image.gz-dtb gets replaced
          # with what this run just built.
          find AK3_extracted -type f ! -name "Image.gz-dtb" -print0 | \
          while IFS= read -r -d '' f; do
            rel="${f#AK3_extracted/}"
            mkdir -p "AK3/$(dirname "$rel")"
            cp "$f" "AK3/$rel"
          done

      - name: Package flashable AK3 zip
        run: |
          # This tree's full kernel build is expected to fail on an
          # unrelated missing vendor blob (see "Build full kernel image"
          # above), so Image/Image.gz-dtb may not exist. Only package if
          # the build actually produced one — skip cleanly otherwise
          # rather than shipping a broken zip.
          IMAGE_PATH=""
          for candidate in \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            kernel/out/arch/arm64/boot/Image.gz \
            kernel/out/arch/arm64/boot/Image
          do
            if [ -f "$candidate" ]; then
              IMAGE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE_PATH" ]; then
            echo "No kernel image found (build likely failed upstream) — skipping packaging."
            exit 0
          fi

          cp "$IMAGE_PATH" AK3/Image.gz-dtb
          cd AK3
          zip -r9 "../Hayasaka-beryllium-${KERNEL_COMMIT}.zip" . -x ".git*"
          cd ..
          ls -la "Hayasaka-beryllium-${KERNEL_COMMIT}.zip"

      - name: Upload flashable AK3 zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-zip-${{ env.KERNEL_COMMIT }}
          path: Hayasaka-beryllium-*.zip
          if-no-files-found: ignore

          
